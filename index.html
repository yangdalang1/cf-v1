<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexStats - 战绩面板</title>
  </head>
  <body>
    <div id="app">
      <!-- 加载动画：当 Vue 还没接管页面时，它会显示 -->
      <div id="global-loader">
        <div class="spinner"></div>
        <div class="loader-text">极速加载中...</div>
      </div>
    </div>
    
    <style>
      #global-loader {
        position: fixed; inset: 0; background: #f8fafc;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 99999; font-family: sans-serif;
      }
      .spinner {
        width: 40px; height: 40px; border: 4px solid #e2e8f0;
        border-top-color: #6366f1; border-radius: 50%;
        animation: spin 1s linear infinite; margin-bottom: 16px;
      }
      .loader-text { color: #64748b; font-size: 14px; font-weight: 500; letter-spacing: 1px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
